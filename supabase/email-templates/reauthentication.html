<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirme sua identidade — TraderLog</title>
</head>
<body style="margin:0;padding:0;background-color:#0f0f0f;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0f0f0f;padding:48px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <span style="font-size:22px;font-weight:700;letter-spacing:-0.5px;color:#e2e2e2;">
                Trader<span style="color:#10b981;">Log</span>
              </span>
            </td>
          </tr>
          <tr>
            <td style="background-color:#161616;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:40px 36px;">
              <p style="margin:0 0 8px;font-size:20px;font-weight:600;color:#e2e2e2;letter-spacing:-0.3px;">
                Confirme sua identidade
              </p>
              <p style="margin:0 0 28px;font-size:14px;color:#666;line-height:1.6;">
                Para continuar com esta operação sensível, precisamos verificar sua identidade. Use o código abaixo:
              </p>
              <div style="background-color:#0f0f0f;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:20px;text-align:center;margin-bottom:28px;">
                <span style="font-size:32px;font-weight:700;letter-spacing:8px;color:#10b981;font-family:'Courier New',monospace;">
                  {{ .Token }}
                </span>
              </div>
              <p style="margin:0;font-size:12px;color:#555;text-align:center;">
                Este código expira em 10 minutos.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:28px;">
              <p style="margin:0 0 4px;font-size:12px;color:#444;">
                Se você não solicitou esta verificação, ignore este e-mail.
              </p>
              <p style="margin:0;font-size:12px;color:#333;">&copy; TraderLog</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
